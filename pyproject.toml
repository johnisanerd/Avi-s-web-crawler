[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-lead-generator"
version = "1.0.0"
description = "Production-grade Real Estate Intelligence Platform & Lead Discovery Engine"
readme = "README.md"
authors = [
    { name = "THE CRAWLER Team", email = "crawler@realestateintel.io" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "rapidfuzz>=3.6.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.2",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
cli = [
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40",
    "colorama>=0.4.6"
]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.0.0"
]

[project.scripts]
crawler = "cli.app:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]
